[workspace]
resolver = "2"
members = [
  "crates/zerocode-core",
  "crates/zerocode-lsp",
  "crates/zerocode-plugin-protocol",
  "crates/zerocode-plugin-word-count",
  "crates/zerocode-tui",
  "crates/zerocode-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crossterm = "0.27"
ratatui = "0.26"
semver = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
